# MLflow Tracking Server: metadata in PostgreSQL, artifacts on a PVC, reachable at localhost:5000.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mlflow-artifacts, namespace: mlops}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops}
spec:
  replicas: 1
  strategy: {type: Recreate}          # RWO volume: never two pods at once
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      securityContext: {runAsUser: 1000, runAsNonRoot: true, fsGroup: 1000}
      initContainers:
        - name: wait-for-postgres     # avoids crash-restarts while the DB boots
          image: postgres:16.4-alpine
          # -U is required: UID 1000 has no passwd entry in this image, so pg_isready can't infer a user
          command: [sh, -c, "until pg_isready -h postgres -p 5432 -U mlflow; do sleep 2; done"]
      containers:
        - name: mlflow
          image: mlflow-server:sha-1f35b97   # loaded with kind load, never :latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: mlflow-db, key: POSTGRES_USER}}}
            - {name: DB_PASS, valueFrom: {secretKeyRef: {name: mlflow-db, key: POSTGRES_PASSWORD}}}
          command: [mlflow, server]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=1             # default spawns several workers and was OOMKilled at 2Gi
            # +psycopg2: SQLAlchemy 2.1 maps bare postgresql:// to psycopg v3, which the image lacks
            - --backend-store-uri=postgresql+psycopg2://$(DB_USER):$(DB_PASS)@postgres:5432/mlflow
            - --artifacts-destination=/mlartifacts
            - --allowed-hosts=localhost,localhost:5000,127.0.0.1:5000,mlflow:5000,mlflow.mlops.svc.cluster.local:5000
          ports: [{containerPort: 5000}]
          readinessProbe: {tcpSocket: {port: 5000}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 5000}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 3Gi}}
          volumeMounts: [{name: artifacts, mountPath: /mlartifacts}]
      volumes: [{name: artifacts, persistentVolumeClaim: {claimName: mlflow-artifacts}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  type: NodePort
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
