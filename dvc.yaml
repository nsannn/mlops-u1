stages:
  prepare:
    cmd: python src/prepare_data.py
    deps: [src/prepare_data.py, data/raw/dataset.parquet]
    params: [prepare.test_size, prepare.seed]
    outs: [data/processed/train.parquet, data/processed/test.parquet]
  train:
    cmd: python src/train.py
    deps: [src/train.py, src/model_utils.py, data/processed/train.parquet, data/processed/test.parquet]
    params: [train]
    outs:
      - models/model            # fine-tuned weights + tokenizer (a directory)
      - models/run_id.txt:
          cache: false          # stays in Git: links the pipeline to the MLflow run
  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, src/model_utils.py, models/model, models/run_id.txt, data/processed/test.parquet]
    metrics:
      - metrics.json:
          cache: false
